name: Deterministic model tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m aerolab benchmark --output output/benchmark.json
      - run: python scripts/generate_nacelle_evidence.py --check
      - run: python scripts/generate_nacelle_credibility.py --check
      - run: python scripts/generate_source_audit.py --check
      - run: python scripts/generate_duct_verification.py --check
      - run: python scripts/generate_historical_motor.py --check
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python tests/ui_smoke.py
      - run: python tests/ui_cad_smoke.py
      - run: python tests/ui_nacelle_smoke.py
      - run: python tests/ui_physics_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-screenshots
          path: |
            output/ui-*.png
            output/ui-*.json
          if-no-files-found: ignore

  cad-regeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cadquery==2.7.0
      - run: python -m unittest discover -s tests -p test_geometry.py -v
      - run: python scripts/generate_cad.py --out output/cad-regenerated
      - run: python scripts/generate_cad_evidence.py
      - run: python scripts/generate_nacelle.py --out output/nacelle-regenerated
      - run: python scripts/export_nacelle_step.py --manifest output/nacelle-regenerated/manifest.json --output output/nacelle-baseline.step
      - run: python scripts/generate_nacelle.py --out output/nacelle-redesign --params '{"hv_fin_count":12,"motor_exhaust_area_mm2":16000}'
      - run: python scripts/export_nacelle_step.py --manifest output/nacelle-redesign/manifest.json --output output/nacelle-redesign.step
      - run: python -m unittest discover -s tests -p test_nacelle_geometry.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-regeneration-evidence
          path: |
            output/cad-regenerated
            output/nacelle-regenerated/manifest.json
            output/nacelle-redesign/manifest.json
            output/nacelle-baseline.step
            output/nacelle-redesign.step
            examples/cad_thermal_evidence.json
