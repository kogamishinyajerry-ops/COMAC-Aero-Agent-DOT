name: Deterministic model tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -S research/openfoam_3d/audit_package.py
      - run: python -S research/openfoam_directional/audit_package.py
      - run: python -m aerolab benchmark --output output/benchmark.json
      - run: python scripts/generate_nacelle_evidence.py --check
      - run: python scripts/generate_nacelle_credibility.py --check
      - run: python scripts/generate_source_audit.py --check
      - run: python scripts/generate_duct_verification.py --check
      - run: python scripts/generate_historical_motor.py --check
      - run: python -S research/axial_fin/audit_package.py --expected-manifest-sha256 5e3b72cbd10966772815fa9b4bfa61f69e338e4483411a3536b7cadef43a073c
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python research/axial_fin/test_package.py --output output/axial-package-contract.json
      - run: python -I -S -B research/pressure_requirement/audit_package.py --expected-manifest-sha256 384a5816d373a7344c569322fb789eb642583e296c105a493d68c6187240aa1a
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -I -S -B research/pressure_requirement/test_package.py --expected-manifest-sha256 384a5816d373a7344c569322fb789eb642583e296c105a493d68c6187240aa1a --report output/pressure-requirement-package-contract.json
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python tests/ui_agent_smoke.py
      - run: python tests/ui_smoke.py
      - run: python tests/ui_cad_smoke.py
      - run: python tests/ui_nacelle_smoke.py
      - run: python tests/ui_physics_smoke.py
      - run: python tests/ui_tradeoff_smoke.py
      - run: python tests/ui_experiments_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-screenshots
          path: |
            output/ui-*.png
            output/ui-*.jpg
            output/ui-*.json
          if-no-files-found: ignore

  cad-regeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cadquery==2.7.0
      - run: python -m unittest discover -s tests -p test_geometry.py -v
      - run: python scripts/generate_cad.py --out output/cad-regenerated
      - run: python scripts/generate_cad_evidence.py
      - run: python scripts/generate_nacelle.py --out output/nacelle-regenerated
      - run: python scripts/export_nacelle_step.py --manifest output/nacelle-regenerated/manifest.json --output output/nacelle-baseline.step
      - run: python scripts/generate_nacelle.py --out output/nacelle-redesign --params '{"hv_fin_count":12,"motor_exhaust_area_mm2":16000}'
      - run: python scripts/export_nacelle_step.py --manifest output/nacelle-redesign/manifest.json --output output/nacelle-redesign.step
      - run: python -m unittest discover -s tests -p test_nacelle_geometry.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-regeneration-evidence
          path: |
            output/cad-regenerated
            output/nacelle-regenerated/manifest.json
            output/nacelle-redesign/manifest.json
            output/nacelle-baseline.step
            output/nacelle-redesign.step
            examples/cad_thermal_evidence.json

  cooling-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8
      - run: python -m unittest discover -s research/openfoam_3d -p 'test_*.py' -v
      - run: python -m unittest discover -s research/openfoam_directional -p 'test_*.py' -v
      - run: python -S research/openfoam_directional/storage.py --extract-to output/directional-evidence
